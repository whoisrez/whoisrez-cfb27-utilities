name: Bootstrap Combined App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-combined-app.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4

      - name: Clone tested combined build
        run: |
          SOURCE_DIR="$RUNNER_TEMP/cfb27-combined-source"
          rm -rf "$SOURCE_DIR"
          git clone --depth 1 --branch feature/combined-team-needs https://github.com/whoisrez/CFB27-Promotion-Relegation.git "$SOURCE_DIR"
          rsync -a --delete --exclude '.git' --exclude '.github' "$SOURCE_DIR/" ./

      - name: Rename app to CFB 27 Utilities
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = 'whoisrez-cfb27-utilities';
          pkg.productName = 'CFB 27 Utilities';
          pkg.version = '0.1.0';
          pkg.description = 'CFB 27 dynasty utilities with Team Needs and Promotion/Relegation tools';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.name = pkg.name;
          lock.version = pkg.version;
          if (lock.packages && lock.packages['']) {
            lock.packages[''].name = pkg.name;
            lock.packages[''].version = pkg.version;
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          const replacements = [
            ['forge.config.ts', [[/CFB 27 Promotion Relegation Tracker/g, 'CFB 27 Utilities']]],
            ['scripts/make-portable.cjs', [
              [/CFB 27 Promotion Relegation Tracker/g, 'CFB 27 Utilities'],
              [/CFB-27-Promotion-Relegation-Tracker-Portable\.zip/g, 'CFB-27-Utilities-Portable.zip'],
              [/CFB 27 Promotion\/Relegation Tracker - Portable Windows Build/g, 'CFB 27 Utilities - Portable Windows Build'],
              [/Tracker history is stored in the data folder beside the executable\./g, 'App data and Promotion/Relegation history are stored in the data folder beside the executable.']
            ]],
            ['src/main.ts', [
              [/whoisrez\.cfb27-dynasty-tools/g, 'whoisrez.cfb27-utilities'],
              [/CFB 27 Dynasty Tools/g, 'CFB 27 Utilities']
            ]],
            ['src/index.html', [[/CFB 27 Dynasty Tools/g, 'CFB 27 Utilities']]],
            ['src/combined-team-needs.ts', [[/Dynasty<br>Tools/g, 'CFB 27<br>Utilities']]]
          ];

          for (const [file, rules] of replacements) {
            if (!fs.existsSync(file)) continue;
            let text = fs.readFileSync(file, 'utf8');
            for (const [pattern, value] of rules) text = text.replace(pattern, value);
            fs.writeFileSync(file, text);
          }

          fs.writeFileSync('README.md', `# CFB 27 Utilities\n\nA combined College Football 27 dynasty companion app.\n\n## Current modules\n\n- **Recruiting → Team Needs**\n  - reads the user-controlled team's roster\n  - tracks graduating, transferring, projected draft, and cut departures\n  - auto-reads committed/signed recruits from the user team's recruiting board\n  - keeps its own weekly Sync action\n\n- **Season → Promotion / Relegation**\n  - tracks the two-tier conference system\n  - supports manual promotion/relegation review and history\n  - keeps its own Season Sync action\n\nThe app uses one shared dynasty import, while each module syncs independently.\n\n## Development\n\n\`\`\`powershell\nnpm.cmd install\nnpm.cmd start\n\`\`\`\n\n## Source history\n\nThis repository began from the tested combined build developed from the standalone CFB27 Team Needs and CFB27 Promotion/Relegation projects. Those standalone repositories remain separate.\n`);
          NODE

      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/bootstrap-combined-app.yml

      - name: Commit migrated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize CFB 27 Utilities combined app"
          git push origin main
