name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Build portable app (verifies the Vite/Electron Forge build)
        run: npm run make
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: CFB-27-Utilities-test-build
          path: out/portable/
          retention-days: 14
